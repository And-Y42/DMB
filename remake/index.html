<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DMB</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="landing">
        <img 
            src="./DMB.png"
            alt="DMB Logo"
            class="hero-image"
        >
        <div class="button-row">
            <button id="signupBtn">Sign Up</button>
            <button id="loginBtn">Log In</button>
            <button id="playBtn">Play</button>
        </div>
        <p class="tagline">
            #1
            Made by Palmer
            Developed by Andy
        </p>
    </div>
    
    <div id="mainPage" class="hidden">
        <h1>Welcome to DMB</h1>
        <p>Solve the clues to find the correct suspect </p>
    </div>
    <!-- JavaScript -->
    <script src="main.js"></script>
</body>
</html>
